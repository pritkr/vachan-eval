services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      VACHAN_DB: /data/vachan.db
      VACHAN_REAL_ASR: ${VACHAN_REAL_ASR:-0}
    volumes:
      - vachan-data:/data
    depends_on:
      db:
        condition: service_started  # db optional; api falls back to SQLite
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vachan
      POSTGRES_PASSWORD: vachan
      POSTGRES_DB: vachan
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    profiles: ["postgres"]  # opt-in: `docker compose --profile postgres up`

volumes:
  vachan-data:
  pg-data:
